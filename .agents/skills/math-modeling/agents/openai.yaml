  short_description: "四阶段建模、红队评审、论文交付与九库多模态检索工作流"
  default_prompt: "使用 $math-modeling 完成题目分析、代码求解、红队评审和论文交付，并在任务确有需要且知识库可用时按需检索。"

dependencies:
  tools:
    - type: "mcp"
      value: "math_modeling_knowledge"
      description: "统一检索八个数学建模文字库和一个多模态原图库"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
