version: 1

# Dify 知识库 Service API。密钥不要写在本文件，统一放到 .env。
dify:
  base_url: "https://dify.space4sgsa.com/v1"
  api_key_env: "DIFY_KNOWLEDGE_API_KEY"
  timeout_seconds: 60
  max_workers: 9

# 各库没有单独配置 retrieval 时使用这里的默认值。
defaults:
  retrieval:
    search_method: "hybrid_search"
    top_k: 3
    reranking_enable: false
    score_threshold_enabled: true
    score_threshold: 0.5

# 汇总阶段只控制显示/交给 Codex 的数量，不改变 Dify 内部索引。
merge:
  max_text_hits: 21
  max_multimodal_context_hits: 6
  max_image_hits: 12
  deduplicate_text: true
  deduplicate_images: true

# MCP 返回给 Codex 的体积限制。检索数量仍由上面的 merge 控制。
mcp:
  max_chars_per_hit: 4000
  max_total_text_chars: 48000
  default_image_count: 4
  max_image_count: 8
  max_image_bytes: 2097152

# dataset_id 留空或写 auto 时，会通过 GET /datasets 按 dify_name 自动查找。
# 如果 Dify 中的实际名称不同，只改 dify_name；无需修改 Python 代码。
knowledge_bases:
  - key: "programming"
    dify_name: "数学建模-编程实现库"
    dataset_id: "13240188-7190-4ee0-b4ea-f0ca59f1b245"
    role: "text"
    enabled: true
    description: "代码实现、调试、数值计算与工程化"

  - key: "modeling_algorithms"
    dify_name: "数学建模-建模算法库"
    dataset_id: "aec16c2e-6cfe-47a1-b5a3-3955706b74c0"
    role: "text"
    enabled: true
    description: "数学模型、算法选择、假设与求解方法"

  - key: "competition_rules"
    dify_name: "数学建模-竞赛规则库"
    dataset_id: "637d1213-6055-4d45-ad01-771f21afb22f"
    role: "text"
    enabled: true
    description: "竞赛规则、格式规范与提交要求"

  - key: "domain_knowledge"
    dify_name: "数学建模-领域知识库"
    dataset_id: "73128bc1-015e-4642-b1ed-8d6bd1eb3703"
    role: "text"
    enabled: true
    description: "题目涉及的跨学科背景知识"

  - key: "paper_writing"
    dify_name: "数学建模-论文写作库"
    dataset_id: "633a214d-a4f8-4e83-89ac-8840783332c7"
    role: "text"
    enabled: true
    description: "论文结构、表达、图表与写作规范"

  - key: "excellent_cases"
    dify_name: "数学建模-优秀案例库"
    dataset_id: "b0fc77bc-8e40-46be-9a31-9242c7cc1f42"
    role: "text"
    enabled: true
    description: "优秀论文的建模思路、论证与实现案例"

  # 新建 Dify 知识库后，填写 dataset_id，并将 enabled 改为 true。
  # 若 Dify 中名称唯一，也可把 dataset_id 写成 auto 自动匹配。
  - key: "mistake_notebook"
    dify_name: "数学建模-错题本"
    dataset_id: "5b33f409-78e0-4ab4-bd6f-e1ee6304bc94"
    role: "text"
    enabled: true
    description: "练习复盘、错误根因、已验证修正、复用触发条件与防错检查"

  # 新建“数学建模-实践复盘库”后填写 dataset_id，再把 enabled 改为 true。
  # 本库沿用 defaults.retrieval，无需重复配置 retrieval。
  - key: "practice_reviews"
    dify_name: "数学建模-实践复盘库"
    dataset_id: "34874b6f-0e6a-429b-befc-ec3375b268fe"
    role: "text"
    enabled: true
    description: "有真实验证证据的推理摘要、完整建模决策链、成功经验与适用边界"

  - key: "multimodal_cases"
    dify_name: "数学建模-多模态库"
    dataset_id: "31420477-b999-4df1-b36b-9b34bf5748cd"
    role: "multimodal"
    enabled: true
    description: "只补充与问题相关的原图、图表及其上下文"
    retrieval:
      search_method: "hybrid_search"
      top_k: 4
      reranking_enable: false
      score_threshold_enabled: true
      score_threshold: 0.55
